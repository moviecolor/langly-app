name: Langly
options:
  deploymentTarget:
    iOS: 18.0
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0
    SUPPORTS_MACCATALYST: YES

schemes:
  Langly:
    shared: true
    build:
      targets:
        Langly: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LanglyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Langly:
    type: application
    platform: iOS
    bundleId: com.langly.app
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.langly.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - sdk: SwiftData.framework
      - sdk: StoreKit.framework
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
    info:
      path: Sources/Info.plist
      owner: Langly

  LanglyTests:
    type: bundle.unit-test
    platform: iOS
    bundleId: com.langly.app.Tests
    sources:
      - Tests
    settings:
      base:
        INFOPLIST_FILE: Tests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.langly.app.Tests
    dependencies:
      - target: Langly
